# Builds MouseYokeEnhanced on every push to main and publishes it as a new numbered release
# (v1.0, v1.1, v1.2...). github.com/rangelsantos/MouseYokeEnhanced/releases/latest is always the newest.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Raise to start a new series: the next release becomes v2.0.
  MAJOR: 1

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit already has a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list "v$MAJOR.*" | sed "s/^v$MAJOR\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "version=$MAJOR.$(( ${last:--1} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # AssemblyInfo.cs keeps 0.0.0 in git, which the app shows as a dev build.
          sed -i -e "s/\"0\.0\.0\.0\"/\"$VERSION.0.0\"/" -e "s/\"0\.0\.0\"/\"$VERSION.0\"/" \
            MouseYokeEnhanced/Properties/AssemblyInfo.cs
          dotnet publish MouseYokeEnhanced/MouseYokeVJoy.csproj -c Release -o out/MouseYokeEnhanced

      - name: Zip
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path out/MouseYokeEnhanced -DestinationPath "MouseYokeEnhanced-v${{ steps.version.outputs.version }}.zip"

      - name: Create the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --format='- %s (%h)' "$PREVIOUS..HEAD"
            else
              echo "- First release of MouseYokeEnhanced."
            fi
            echo
            echo "## Install"
            echo
            echo "Unzip \`MouseYokeEnhanced-v$VERSION.zip\` anywhere you can write to (not Program Files) and run \`MouseYokeVJoy.exe\`."
            echo "Needs the .NET 8 Desktop Runtime (x64) and vJoy (device 1). See \`MouseYokeEnhanced_Manual.md\`."
          } > notes.md
          gh release create "v$VERSION" "MouseYokeEnhanced-v$VERSION.zip" --target "$GITHUB_SHA" --latest \
            --title "MouseYokeEnhanced v$VERSION" --notes-file notes.md
